<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treluc CV</title>
    <!-- Favicon (si tienes uno) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }
        .loader {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: #02b3a6; /* Color de tu tema */
            width: 40px;
            height: 40px;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script type="module">
        import { auth, onAuthStateChanged } from './firebase-config.js';
        
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');
        
        if (uid) {
            // Si es un enlace compartido, redirigir al visor público de forma silenciosa
            window.location.replace('cv.html?uid=' + uid);
        } else {
            // Si es la raíz, redirigir al editor o al login según la sesión
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    window.location.replace('editor.html');
                } else {
                    window.location.replace('login.html');
                }
            });
        }
    </script>
</body>
</html>
