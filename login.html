<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Iniciar Sesión - Editor de CV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; background-color: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        .login-box h1 { margin-top: 0; color: #1e293b; font-size: 24px; margin-bottom: 10px; }
        .login-box p { color: #64748b; margin-bottom: 30px; font-size: 14px; }
        
        /* Formularios de Correo */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; font-family: inherit; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        
        .btn { border: none; padding: 12px 20px; border-radius: 5px; font-size: 16px; font-weight: 600; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.3s; margin-bottom: 10px; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        
        .btn-outline { background-color: transparent; border: 1px solid #3b82f6; color: #3b82f6; }
        .btn-outline:hover { background-color: #eff6ff; }
        
        .divider { display: flex; align-items: center; text-align: center; color: #94a3b8; margin: 20px 0; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .divider::before { margin-right: .25em; }
        .divider::after { margin-left: .25em; }

        .btn-google { background-color: white; color: #475569; border: 1px solid #cbd5e1; }
        .btn-google:hover { background-color: #f8fafc; }
        .btn-google img { width: 20px; height: 20px; }
        
        .loader { display: none; margin-top: 20px; color: #3b82f6; font-weight: bold; }
        #error-message { color: #ef4444; font-size: 13px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Tu CV en la Nube</h1>
        <p>Inicia sesión o regístrate para editar tu currículum.</p>
        
        <div id="error-message"></div>

        <form id="email-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@correo.com">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="button" id="btn-login-email" class="btn btn-primary">Iniciar Sesión</button>
            <button type="button" id="btn-register-email" class="btn btn-outline">Crear Cuenta Nueva</button>
        </form>

        <div class="divider">O ESTO</div>

        <button id="btn-login-google" class="btn btn-google">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
            Continuar con Google
        </button>
        <div id="loader" class="loader">Verificando...</div>
    </div>

    <script type="module">
        import { auth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword } from './firebase-config.js';
        
        const btnLoginGoogle = document.getElementById('btn-login-google');
        const btnLoginEmail = document.getElementById('btn-login-email');
        const btnRegisterEmail = document.getElementById('btn-register-email');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');
        const loader = document.getElementById('loader');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'editor.html';
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.style.display = 'block';
            loader.style.display = 'none';
        }

        function showLoader() {
            errorMessage.style.display = 'none';
            loader.style.display = 'block';
        }

        // --- Inicio con Google ---
        btnLoginGoogle.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            showLoader();
            try {
                await signInWithPopup(auth, provider);
                // redirige automáticamente gracias al observer onAuthStateChanged
            } catch (error) {
                console.error(error);
                showError("Error con Google: " + error.message);
            }
        });

        // --- Inicio con Correo ---
        btnLoginEmail.addEventListener('click', async () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showError("Llena ambos campos");
            showLoader();
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error(error);
                let msg = "Error al iniciar sesión.";
                if(error.code === 'auth/invalid-credential') msg = "Correo o contraseña incorrectos.";
                showError(msg);
            }
        });

        // --- Registro con Correo ---
        btnRegisterEmail.addEventListener('click', async () => {
            const email = emailInput.value;
            const password = passwordInput.value;
            if(!email || !password) return showError("Llena ambos campos para registrarte");
            if(password.length < 6) return showError("La contraseña debe tener al menos 6 caracteres");
            showLoader();
            try {
                await createUserWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error(error);
                let msg = "Error al registrarse.";
                if(error.code === 'auth/email-already-in-use') msg = "Ese correo ya está registrado.";
                showError(msg);
            }
        });
    </script>
</body>
</html>
